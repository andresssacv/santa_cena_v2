 <!DOCTYPE html>
 <html lang="es">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu ubicación - Santa Cena 2026</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #0f172a; }
        .wrapper { height: 100%; display: flex; flex-direction: column; }
        .banner {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: white;
            background: linear-gradient(90deg, #1d4ed8, #0ea5e9);
            padding: 10px 14px;
            font-weight: 700;
            font-size: 14px;
            text-align: center;
            letter-spacing: 0.2px;
        }
        iframe { flex: 1; width: 100%; border: 0; background: #f1f5f9; }
    </style>
 </head>
    <div class="wrapper">
        <div class="banner">Modo solo lectura · Fila {{ fila_asignada }}</div>
        <iframe
            src="/mapa?readOnly=true&fila={{ fila_asignada | urlencode }}"
            title="Mapa de ubicación"
            loading="eager"
            referrerpolicy="no-referrer"
        ></iframe>
     </div>
 </body>
 </html>
