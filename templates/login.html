<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso Captadores | Santa Cena 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-200/80 p-6 sm:p-8">
    
    <!-- Logo y Encabezado -->
    <div class="text-center mb-6">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-[#8b1e2d] text-white flex items-center justify-center font-black text-2xl shadow-lg mb-3">
        ✝
      </div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">Santa Cena 2026</h1>
      <p class="text-xs text-slate-500 font-semibold mt-1">Ingreso de Captadoras y Administración</p>
    </div>

    <!-- Formulario -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs uppercase tracking-wider font-extrabold text-slate-600 mb-1.5">Correo Electrónico</label>
        <input 
          id="email" 
          type="email" 
          required 
          autocomplete="email"
          class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-sm font-bold text-slate-800 placeholder-slate-400 focus:border-[#8b1e2d] focus:bg-white outline-none transition" 
          placeholder="tu@email.com"
        >
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wider font-extrabold text-slate-600 mb-1.5">Contraseña</label>
        <input 
          id="password" 
          type="password" 
          required 
          autocomplete="current-password"
          class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-sm font-bold text-slate-800 placeholder-slate-400 focus:border-[#8b1e2d] focus:bg-white outline-none transition" 
          placeholder="••••••••"
        >
      </div>

      <button 
        id="submitBtn" 
        type="submit" 
        class="w-full bg-[#8b1e2d] text-white font-black py-3.5 rounded-xl hover:bg-[#701824] shadow-md transition active:scale-[0.99] text-sm tracking-wide mt-2"
      >
        Ingresar a la App
      </button>

      <div id="msg" class="text-xs font-bold text-red-600 bg-red-50 p-3 rounded-xl border border-red-200 hidden text-center"></div>
    </form>
    
    <div class="mt-6 text-center">
      <span class="text-[11px] text-slate-400 font-medium">Servicio de Santa Cena · Iglesia</span>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verificando...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok || data.status !== 'success') {
          throw new Error(data.message || 'Credenciales inválidas');
        }

        localStorage.setItem('accessToken', data.access_token);
        if (data.refresh_token) {
          localStorage.setItem('refreshToken', data.refresh_token);
        }
        window.location.href = '/mapa';
      } catch (err) {
        msg.textContent = err.message || 'Error de conexión';
        msg.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Ingresar a la App';
      }
    });
  </script>
</body>
</html>
